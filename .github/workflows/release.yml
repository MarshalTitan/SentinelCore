name: Publish Libraries

on:
  push:
    branches: [main]
    paths: [Directory.Build.props]
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

concurrency:
  group: publish-core-libraries
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $version = [string]$props.Project.PropertyGroup.SentinelCoreVersion
          if ('${{ github.ref }}'.StartsWith('refs/tags/') -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag '${{ github.ref_name }}' does not match Sentinel Core version 'v$version'."
          }
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $dalamudDir = Join-Path $env:RUNNER_TEMP 'dalamud-dev'
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force
          "DALAMUD_HOME=$dalamudDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore SentinelCore.slnx -m:1
          dotnet build SentinelCore.slnx -c Release --no-restore -m:1
          dotnet run --project tests/SentinelCore.Tests/SentinelCore.Tests.csproj -c Release --no-build
          dotnet run --project tests/SentinelCore.UI.Tests/SentinelCore.UI.Tests.csproj -c Release --no-build

      - name: Pack libraries
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path 'artifacts/packages' -Force | Out-Null
          dotnet pack src/SentinelCore/SentinelCore.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/SentinelCore.Dalamud/SentinelCore.Dalamud.csproj -c Release -p:Platform=x64 --no-build -o artifacts/packages
          dotnet pack src/SentinelCore.UI/SentinelCore.UI.csproj -c Release -p:Platform=x64 --no-build -o artifacts/packages

      - name: Record immutable package hashes
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            [ordered]@{
              file = $_.Name
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($_.FullName)))
            }
          })
          if ($packages.Count -ne 3) { throw 'Expected three libraries.' }
          $manifest = [ordered]@{ commit = '${{ github.sha }}'; tag = '${{ steps.version.outputs.tag }}'; packages = $packages }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content artifacts/packages/package-hashes.json
          Get-Content artifacts/packages/package-hashes.json

      - name: Publish immutable GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $existing = gh release view $tag --repo '${{ github.repository }}' --json targetCommitish,isDraft,assets 2>$null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) {
            $release = $existing | ConvertFrom-Json
            if ($release.targetCommitish -ne '${{ github.sha }}' -or $release.isDraft) {
              throw 'Existing release differs from this source. Increment the version; never replace assets.'
            }
            foreach ($file in Get-ChildItem artifacts/packages -File) {
              if (@($release.assets | Where-Object name -eq $file.Name).Count -ne 1) {
                throw "Existing release is incomplete: $($file.Name). Do not overwrite it."
              }
            }
            Write-Host 'Exact-source release already exists; assets left immutable.'
          }
          else {
            gh release create $tag artifacts/packages/* --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Sentinel Core $tag" --notes 'Additive navigation and sanitized diagnostics foundations. Opt-in consumers only; supervised SRank proving is required before broader adoption. Existing UI APIs are unchanged. Development libraries, not an installable plugin.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }

      - name: Verify published package hashes
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $root = Join-Path $env:RUNNER_TEMP 'published-core'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          Invoke-WebRequest "$base/package-hashes.json" -OutFile "$root/package-hashes.json"
          $manifest = Get-Content "$root/package-hashes.json" -Raw | ConvertFrom-Json
          if ($manifest.commit -ne '${{ github.sha }}') { throw 'Public source mismatch.' }
          foreach ($package in $manifest.packages) {
            $path = Join-Path $root $package.file
            Invoke-WebRequest "$base/$($package.file)" -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $package.sha256) {
              throw "Public hash mismatch: $($package.file)"
            }
          }
          Write-Host 'All three public library hashes verified.'

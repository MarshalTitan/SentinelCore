name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore generic tests
        run: dotnet restore tests/SentinelCore.Tests/SentinelCore.Tests.csproj

      - name: Run generic tests
        run: dotnet run --project tests/SentinelCore.Tests/SentinelCore.Tests.csproj -c Release --no-restore

  full:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $dalamudDir = Join-Path $env:RUNNER_TEMP 'dalamud-dev'
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force
          "DALAMUD_HOME=$dalamudDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        run: dotnet restore SentinelCore.slnx -m:1

      - name: Build all libraries
        run: dotnet build SentinelCore.slnx -c Release --no-restore -m:1

      - name: Run tests
        run: dotnet run --project tests/SentinelCore.Tests/SentinelCore.Tests.csproj -c Release --no-build

      - name: Pack versioned libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts/packages' -Force | Out-Null
          dotnet pack src/SentinelCore/SentinelCore.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/SentinelCore.Dalamud/SentinelCore.Dalamud.csproj -c Release -p:Platform=x64 --no-build -o artifacts/packages
          dotnet pack src/SentinelCore.UI/SentinelCore.UI.csproj -c Release -p:Platform=x64 --no-build -o artifacts/packages

      - name: Verify library-only boundary
        shell: pwsh
        run: |
          if (Test-Path 'repo.json') { throw 'Sentinel Core must not contain a Dalamud catalog manifest.' }
          $pluginManifests = @(git ls-files '*.json' | Where-Object {
            [System.IO.Path]::GetFileName($_) -match '^SentinelCore.*\.json$'
          })
          if ($pluginManifests.Count -gt 0) {
            throw 'Sentinel Core must not contain a Dalamud plugin manifest.'
          }
          if (Get-ChildItem -Recurse -Filter 'latest.zip') { throw 'Sentinel Core must not produce an installable plugin ZIP.' }
          $packages = @(Get-ChildItem 'artifacts/packages' -Filter '*.nupkg')
          if ($packages.Count -ne 3) { throw "Expected three NuGet packages, found $($packages.Count)." }

      - name: Upload library packages
        uses: actions/upload-artifact@v4
        with:
          name: SentinelCore-0.1.0.0
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
